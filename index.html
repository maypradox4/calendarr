    <style>
        :root {
            --bg-color: #fdf6f0;
            --card-bg: #ffffff;
            --primary-pink: #f4a2b3;
            --deep-pink: #e86a82;
            --accent-purple: #a855f7;
            --text-main: #4a3b32;
            --text-muted: #8c7b70;
            --grid-border: #ebdcd5;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e0cfc5 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--deep-pink);
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .month-picker {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 15px 0 25px;
            background: var(--card-bg);
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .btn-nav {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--deep-pink);
            transition: transform 0.2s;
        }

        .btn-nav:hover {
            transform: scale(1.2);
        }

        .current-month {
            font-size: 1.3rem;
            font-weight: 700;
            min-width: 140px;
            text-align: center;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 3px solid #ffffff;
        }

        .weekday-header {
            text-align: center;
            font-weight: 700;
            color: var(--accent-purple);
            font-size: 0.9rem;
            padding-bottom: 8px;
        }

        .day-card {
            aspect-ratio: 1;
            background: #fff8f6;
            border: 2px solid var(--grid-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .day-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-pink);
            background: #fff0f3;
        }

        .day-number {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .day-card.special-day {
            background: linear-gradient(135deg, #fce7f3, #f472b6);
            border-color: #ec4899;
            color: #831843;
            animation: pulseSpecial 2s infinite;
        }

        @keyframes pulseSpecial {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .day-icon {
            font-size: 0.75rem;
            margin-top: 2px;
        }

        /* MODAL POPUP */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 28px;
            max-width: 480px;
            width: 100%;
            padding: 30px 25px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 4px solid var(--primary-pink);
        }

        .modal-date {
            font-size: 0.95rem;
            color: var(--accent-purple);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .modal-message {
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            color: var(--text-main);
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .music-box {
            background: #fdf2f8;
            border: 2px dashed #f472b6;
            border-radius: 16px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }

        .music-info {
            text-align: left;
        }

        .music-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #be185d;
        }

        .music-artist {
            font-size: 0.85rem;
            color: #9d174d;
        }

        .btn-listen {
            background: #db2777;
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-listen:hover {

        }

        .btn-close {

            border: none;
            padding: 10px 30px;

            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(232, 106, 130, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 500px) {
            .calendar-grid { gap: 6px; padding: 12px; }
            .day-number { font-size: 0.95rem; }
            .modal-message { font-size: 1.5rem; }
        }
    </style>
</head>

        let mesAtualIdx = 9; // Inicia em Outubro para ver o aniversário diretamente

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthDisplay = document.getElementById('month-display');
            grid.innerHTML = '';

            monthDisplay.innerText = mesesNomes[mesAtualIdx];

            // Dias da Semana no Cabeçalho
            const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            diasSemana.forEach(dia => {
                const header = document.createElement('div');
                header.className = 'weekday-header';
                header.innerText = dia;
                grid.appendChild(header);
            });

            // Quantidade de dias no mês
            const totalDias = diasNosMeses[mesAtualIdx];

            // Calcular dia do ano acumulado
            let diaDoAnoInicio = 0;
            for (let i = 0; i < mesAtualIdx; i++) {
                diaDoAnoInicio += diasNosMeses[i];
            }

            for (let d = 1; d <= totalDias; d++) {
                const indexGeral = diaDoAnoInicio + (d - 1);
                const itemDados = baseDeDados[indexGeral] || baseDeDados[0];

                const card = document.createElement('div');
                card.className = 'day-card';

                // Destaque especial para o dia 03/10 (Aniversário)
                if (mesAtualIdx === 9 && d === 3) {
                    card.classList.add('special-day');
                }

                card.innerHTML = `
                    <div class="day-number">${d}</div>
                    <div class="day-icon">${(mesAtualIdx === 9 && d === 3) ? '🎂' : '💌'}</div>
                `;

                card.onclick = () => openModal(d, mesesNomes[mesAtualIdx], itemDados);
                grid.appendChild(card);
            }
        }

        function changeMonth(delta) {
            mesAtualIdx += delta;
            if (mesAtualIdx < 0) mesAtualIdx = 11;
            if (mesAtualIdx > 11) mesAtualIdx = 0;
            renderCalendar();
        }

        function openModal(dia, mes, dados) {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-date').innerText = `${dia} DE ${mes.toUpperCase()}`;
            document.getElementById('modal-message').innerText = dados.msg;
            document.getElementById('music-title').innerText = dados.musica;
            document.getElementById('music-artist').innerText = dados.cantor;

            // Link de busca no YouTube para tocar a música diretamente
            const queryBusca = encodeURIComponent(`${dados.musica} ${dados.cantor}`);
            document.getElementById('music-link').href = `https://www.youtube.com/results?search_query=${queryBusca}`;

            modal.classList.add('active');
        }

        function closeModal(event) {
            if (event.target.id === 'modal-overlay') {
                document.getElementById('modal-overlay').classList.remove('active');
            }
        }

        function forceCloseModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        // Renderiza o calendário ao carregar a página
        window.onload = function() {
            renderCalendar();
        };
    </script>
